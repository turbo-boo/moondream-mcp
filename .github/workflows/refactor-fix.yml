name: Format refactor branch

on:
  push:
    branches:
      - refactor/usability-and-safety
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/usability-and-safety

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Format Python
        run: |
          python -m pip install black==23.12.1 isort==5.13.2
          black src tests
          isort src tests

      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Format refactored code"
            git push origin HEAD:refactor/usability-and-safety
          fi
