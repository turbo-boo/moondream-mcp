name: Format PR branch

on:
  push:
    branches:
      - update/moondream-3.1-photon

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/moondream-3.1-photon

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatters
        run: pip install black==23.12.1 isort==5.13.2

      - name: Format source and tests
        run: |
          black src/ tests/
          isort src/ tests/

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: apply Black and isort"
          git push origin HEAD:update/moondream-3.1-photon
