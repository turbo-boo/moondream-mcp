[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moondream-mcp"
version = "2.0.1"
description = "FastMCP server for Moondream 3.1 vision-language models"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Moondream MCP Contributors", email = "contributors@moondream-mcp.dev"}
]
maintainers = [
    {name = "Moondream MCP Contributors", email = "contributors@moondream-mcp.dev"}
]
keywords = [
    "mcp",
    "fastmcp",
    "moondream",
    "vision",
    "language-model",
    "ai",
    "computer-vision",
    "image-analysis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastmcp==3.4.4",
    "moondream==2.0.1",
    "torch>=2.5.0",
    "pillow>=10.0.0",
    "aiohttp>=3.10.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    "bandit[toml]>=1.7.9",
    "pre-commit>=3.8.0",
    "types-aiofiles>=24.1.0"
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=4.0.0",
    "sphinx-autodoc-typehints>=2.2.0"
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0"
]

[project.urls]
Homepage = "https://github.com/turbo-boo/moondream-mcp"
Documentation = "https://github.com/turbo-boo/moondream-mcp#readme"
Repository = "https://github.com/turbo-boo/moondream-mcp.git"
Issues = "https://github.com/turbo-boo/moondream-mcp/issues"
Changelog = "https://github.com/turbo-boo/moondream-mcp/blob/main/CHANGELOG.md"

[project.scripts]
moondream-mcp = "moondream_mcp.server:main"
setup-claude-desktop = "moondream_mcp.scripts.setup_claude_desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moondream_mcp = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["moondream_mcp"]
known_third_party = ["fastmcp", "moondream", "torch", "PIL", "aiohttp", "pydantic"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "moondream.*",
    "torch.*",
    "PIL.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "-ra"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/moondream_mcp"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]
